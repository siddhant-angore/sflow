name: upstream-drift

on:
  schedule:
    - cron: '30 3 * * 1' # Monday 03:30 UTC = 09:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check vendored sources against upstream
        id: upstream
        run: |
          set +e
          node scripts/upstream.mjs > report.txt
          code=$?
          cat report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the drift issue
        if: steps.upstream.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.upstream.outputs.code }}
        run: |
          label=upstream-drift
          gh label create "$label" --description "A vendored upstream moved or broke" --color FBCA04 2>&1 | grep -v 'already exists' || true
          if [ "$CODE" = "10" ]; then kind="Upstream drift"; else kind="Upstream check ERROR"; fi
          title="$kind: $(date -u +%F)"
          {
            echo '```text'
            cat report.txt
            echo '```'
            echo
            echo 'Next: bump sha -> npm run sync -> re-anchor overlays -> npm run check -> PR'
            echo
            echo "Generated by the upstream-drift workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > body.md
          number=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file body.md
          else
            gh issue create --label "$label" --title "$title" --body-file body.md
          fi

      - name: Fail on error
        if: steps.upstream.outputs.code == '1'
        run: |
          echo "upstream check hit an error (exit 1); see the report above and the issue"
          exit 1

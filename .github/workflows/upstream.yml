name: upstream-drift

on:
  schedule:
    - cron: '30 3 * * 1' # Monday 03:30 UTC = 09:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: upstream-drift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Exit 1 is often a transient network error, so it gets one retry; the retry's code and report are the result.
      - name: Check vendored sources against upstream
        id: upstream
        run: |
          set +e
          check() {
            node scripts/upstream.mjs --json > report.json
            code=$?
            node scripts/upstream.mjs --from-json report.json > report.txt || echo "(could not render report.json; exit $code)" > report.txt
            cat report.txt
          }
          check
          if [ "$code" = "1" ]; then
            echo "exit 1; retrying once in 30s"
            sleep 30
            check
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Find the open drift issue
        id: issue
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Close the drift issue when every source is current
        if: steps.upstream.outputs.code == '0' && steps.issue.outputs.number != ''
        env:
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Held sources are deferred, not current; name them so the deferral stays visible. A held source that has caught up is a stale hold.
          # Reads report.json from the check step (no second network run). A failed read says so rather than hiding them.
          if held=$(jq -r '.sources[] | select(.hold != null) | "- \(.source): \(.hold) [\(.status)]" + (if .status == "current" then " \u2014 STALE HOLD: upstream is current; remove the hold" else "" end)' report.json); then
            :
          else
            held="- (could not read the held list; see the run log: $run_url)"
          fi
          {
            echo "All vendored sources are current as of $run_url; closing."
            if [ -n "$held" ]; then
              echo
              echo 'Held sources:'
              printf '%s\n' "$held"
            fi
          } | head -c 60000 > comment.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat comment.md)"

      - name: Open, update, or comment on the drift issue
        if: steps.upstream.outputs.code != '0'
        env:
          CODE: ${{ steps.upstream.outputs.code }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --description "A vendored upstream moved or broke" --color FBCA04 --force
          if [ "$CODE" = "10" ]; then kind="Upstream drift"; else kind="Upstream check ERROR"; fi
          title="$kind: $(date -u +%F)"
          {
            echo '```text'
            head -c 60000 report.txt
            echo
            echo '```'
            if [ "$(wc -c < report.txt)" -gt 60000 ]; then
              echo
              echo "The report was truncated at 60,000 characters; see the full report in the run log: $run_url"
            fi
            echo
            echo 'Next: bump sha -> npm run sync -> re-anchor overlays -> npm run check -> PR'
            echo
            echo "Generated by the upstream-drift workflow: $run_url"
          } > body.md
          if [ "$CODE" = "10" ] && [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          elif [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" --title "$title" --body-file body.md
          fi

      - name: Fail on error
        if: steps.upstream.outputs.code != '0' && steps.upstream.outputs.code != '10'
        env:
          CODE: ${{ steps.upstream.outputs.code }}
        run: |
          if [ "$CODE" = "1" ]; then retry=" after one retry"; else retry=""; fi
          echo "upstream check failed with exit code ${CODE:-<empty>}${retry}; see the report above and the issue"
          exit 1
